<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="/favicon.ico" />
    <title>BizMind · AI 智慧名片與人脈管理平台</title>
    <meta name="description" content="結合 Gemini AI 多卡視覺辨識、雙面名片合併、無紙化電子名片交換與溫暖跟進信草擬的智慧人脈管理系統。">
    <meta property="og:title" content="BizMind · AI 智慧名片與人脈管理平台">
    <meta property="og:description" content="結合 Gemini AI 多卡視覺辨識、雙面名片合併、無紙化電子名片交換與溫暖跟進信草擬的智慧人脈管理系統。">

    <!-- LINE Browser Redirect Strategy -->
    <script>
      if (/Line/i.test(navigator.userAgent)) {
        if (location.search.indexOf('openExternalBrowser=1') === -1) {
          var separator = location.search ? '&' : '?';
          location.href = location.href + separator + 'openExternalBrowser=1';
        }
      }
    </script>

    <!-- Domain Fonts: Plus Jakarta Sans + Public Sans + Noto Sans TC + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
      window.onerror = function(msg, url, lineNo) {
        var msgStr = String(msg || "");
        var lowercaseMsg = msgStr.toLowerCase();
        if (
          msgStr === "Script error." ||
          msgStr === "Script error" ||
          lowercaseMsg.indexOf("script error") > -1 ||
          lowercaseMsg.indexOf("extension") > -1 ||
          !url ||
          (url.indexOf("http") !== 0) ||
          url.indexOf("chrome-extension") > -1
        ) {
          return true;
        }
        var errorOverlay = document.getElementById('error-overlay');
        var errorMsg = document.getElementById('error-msg');
        if (errorOverlay && errorMsg) {
          errorOverlay.style.display = 'flex';
          errorMsg.innerText = msg + '\n(Line: ' + lineNo + ')';
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || String(reason)) : "";
        var lowercaseMsg = msg.toLowerCase();
        if (
          lowercaseMsg.indexOf("script error") > -1 ||
          lowercaseMsg.indexOf("cors") > -1 ||
          lowercaseMsg.indexOf("extension") > -1
        ) {
          event.preventDefault();
        }
      });
    </script>
</head>
<body>
    <div id="error-overlay" class="hidden fixed inset-0 bg-white z-[10000] flex-col items-center justify-center p-8 text-center">
        <h2 class="font-bold text-slate-900 mb-2 text-lg">啟動失敗</h2>
        <p id="error-msg" class="text-xs text-slate-600 font-mono bg-slate-50 border border-slate-200 p-3 rounded-lg mb-4 max-w-sm break-all"></p>
        <button onclick="location.reload()" class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition-colors">重新載入</button>
    </div>

    <div id="root">
        <div class="flex flex-col items-center justify-center h-full gap-3 bg-slate-50">
            <div class="w-8 h-8 border-2 border-slate-200 border-t-indigo-600 rounded-full animate-spin"></div>
            <p class="text-xs font-medium text-slate-500">正在載入 BizMind 工作區...</p>
        </div>
    </div>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
